name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受 SDK 许可
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: 缓存 Gradle 发行版
        id: gradle-cache
        uses: actions/cache@v4
        with:
          path: /opt/gradle-dist
          key: gradle-8.7-dist

      - name: 准备 Gradle 8.7
        run: |
          if [ ! -x /opt/gradle-dist/gradle-8.7/bin/gradle ]; then
            sudo mkdir -p /opt/gradle-dist
            cd /opt/gradle-dist
            sudo curl -sL -o g.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
            sudo unzip -q -o g.zip
            sudo rm -f g.zip
          fi
          /opt/gradle-dist/gradle-8.7/bin/gradle --version | head -3

      - name: 写入 local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: 编译 ${{ inputs.build_type || 'debug' }} APK
        run: |
          GRADLE=/opt/gradle-dist/gradle-8.7/bin/gradle
          if [ "${{ inputs.build_type || 'debug' }}" = "release" ]; then
            $GRADLE :app:assembleRelease --no-daemon --stacktrace
          else
            $GRADLE :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniOperit-${{ inputs.build_type || 'debug' }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
