name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 ubuntu-latest 镜像自带 Android SDK，不再依赖 setup-android
      - name: 定位并准备 Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          ls "$SDK" || true
          # 接受许可
          for sm in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager" "$SDK/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$sm" ]; then
              yes | "$sm" --licenses >/dev/null 2>&1 || true
              "$sm" "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null 2>&1 || true
              break
            fi
          done
          echo "sdk.dir=$SDK" > local.properties
          ls "$SDK/platforms" 2>/dev/null || true

      - name: 缓存 Gradle 发行版
        uses: actions/cache@v4
        with:
          path: /opt/gradle-dist
          key: gradle-8.7-dist

      - name: 准备 Gradle 8.7
        run: |
          if [ ! -x /opt/gradle-dist/gradle-8.7/bin/gradle ]; then
            sudo mkdir -p /opt/gradle-dist
            cd /opt/gradle-dist
            sudo curl -sL -o g.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
            sudo unzip -q -o g.zip
            sudo rm -f g.zip
          fi
          /opt/gradle-dist/gradle-8.7/bin/gradle --version | head -3

      - name: 编译 ${{ inputs.build_type || 'debug' }} APK
        run: |
          GRADLE=/opt/gradle-dist/gradle-8.7/bin/gradle
          if [ "${{ inputs.build_type || 'debug' }}" = "release" ]; then
            $GRADLE :app:assembleRelease --no-daemon --stacktrace
          else
            $GRADLE :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniOperit-${{ inputs.build_type || 'debug' }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
