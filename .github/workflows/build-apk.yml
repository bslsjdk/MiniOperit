name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 ubuntu-latest 镜像自带 Android SDK，不再依赖 setup-android
      - name: 定位并准备 Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          ls "$SDK" || true
          # 接受许可
          for sm in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager" "$SDK/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$sm" ]; then
              yes | "$sm" --licenses >/dev/null 2>&1 || true
              "$sm" "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null 2>&1 || true
              break
            fi
          done
          echo "sdk.dir=$SDK" > local.properties
          ls "$SDK/platforms" 2>/dev/null || true

      - name: 缓存 Gradle 发行版
        uses: actions/cache@v4
        with:
          path: /opt/gradle-dist
          key: gradle-8.7-dist

      - name: 准备 Gradle 8.7
        run: |
          if [ ! -x /opt/gradle-dist/gradle-8.7/bin/gradle ]; then
            sudo mkdir -p /opt/gradle-dist
            cd /opt/gradle-dist
            sudo curl -sL -o g.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
            sudo unzip -q -o g.zip
            sudo rm -f g.zip
          fi
          /opt/gradle-dist/gradle-8.7/bin/gradle --version | head -3

      - name: 编译 ${{ inputs.build_type || 'debug' }} APK
        id: gradle
        continue-on-error: true
        run: |
          GRADLE=/opt/gradle-dist/gradle-8.7/bin/gradle
          if [ "${{ inputs.build_type || 'debug' }}" = "release" ]; then
            $GRADLE :app:assembleRelease --no-daemon --stacktrace > gradle.log 2>&1 || true
          else
            $GRADLE :app:assembleDebug --no-daemon --stacktrace > gradle.log 2>&1 || true
          fi
          # 只保留错误相关行，控制体积
          grep -nE '^e: |^w: |error:|FAILURE|What went wrong|\* Try|Caused by|Could not|Unresolved|Cannot|Exception' gradle.log | head -120 || true
          echo "--- 日志尾部 ---"
          tail -n 40 gradle.log

      - name: 回传编译日志
        if: always()
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          tok = os.environ['GITHUB_TOKEN']; repo = os.environ['GITHUB_REPOSITORY']
          if not os.path.exists('gradle.log'): raise SystemExit(0)
          raw = open('gradle.log','rb').read()[-120000:]
          payload = {'message':'ci: gradle build log','content':base64.b64encode(raw).decode(),'branch':'main'}
          try:
              g = urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/BUILD-LOG.txt')
              g.add_header('Authorization','Bearer '+tok); g.add_header('User-Agent','b')
              with urllib.request.urlopen(g, timeout=120) as gr: payload['sha']=json.load(gr).get('sha')
          except Exception: pass
          req = urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/BUILD-LOG.txt', method='PUT')
          req.add_header('Authorization','Bearer '+tok); req.add_header('Accept','application/vnd.github+json')
          req.add_header('Content-Type','application/json'); req.add_header('User-Agent','b')
          try:
              with urllib.request.urlopen(req, json.dumps(payload).encode(), timeout=300) as r:
                  print('log ok', r.status)
          except Exception as e: print('log failed', repr(e)[:300])
          PY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle.log
          if-no-files-found: warn
          retention-days: 14

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniOperit-${{ inputs.build_type || 'debug' }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
